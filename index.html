<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Hyperscale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout : en-tête d'exploitation, rangée de baies vue de face à gauche, panneau d'inspection à droite */
:root{
  color-scheme:dark;
  --bg:#070b0e;
  --panel:#0f171c;
  --panel-2:#152129;
  --panel-3:#1b2a33;
  --edge:#243641;
  --fg:#d8e6eb;
  --dim:#83989f;
  --accent:#ffb547;
  --cyan:#46c7ff;
  --ok:#3ce07a;
  --warn:#ffb547;
  --bad:#ff6b5d;
  --f-display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--f-mono);font-size:.92em}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}

/* En-tête */
#top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,#132029,#0d161b);border-bottom:1px solid var(--edge)}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand b{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.14em;background:linear-gradient(90deg,#7fdcff,#fff 60%,#ffd28a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#bfeeff}
.brand small{font-family:var(--f-mono);font-size:10px;color:var(--dim);letter-spacing:.06em}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.stat .val{font-family:var(--f-mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .sub{font-family:var(--f-mono);font-size:10.5px;color:var(--dim);white-space:nowrap}
#money{color:#ffd28a}#money.neg{color:var(--bad)}
.val.warn{color:var(--warn)}.val.bad{color:var(--bad)}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--edge);border-radius:6px;overflow:hidden;background:#0a1318}
.seg button{background:transparent;border:0;padding:5px 10px;font-family:var(--f-mono);font-size:12px;color:var(--dim)}
.seg button+button{border-left:1px solid var(--edge)}
.seg button[aria-pressed="true"]{background:#1d3442;color:var(--accent)}
.tbtn{background:linear-gradient(180deg,#1a2c38,#111e26);border:1px solid var(--edge);border-radius:6px;padding:6px 11px;font-size:12.5px}
.tbtn:hover{border-color:#3a5869}
.tbtn.hl{border-color:var(--accent);color:var(--accent)}

/* Zone principale */
#main{display:grid;grid-template-columns:minmax(0,1fr) 410px;min-height:0}
#view{position:relative;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 0%,#14202a,#06090c 70%)}
#rackview{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default;user-select:none}
#rackview.panning{cursor:grabbing}
#viewbar{position:absolute;z-index:2;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#viewbar .seg{background:rgba(10,19,24,.92)}
#hint{position:absolute;z-index:2;left:10px;right:10px;bottom:10px;margin:0;padding:7px 12px;border-radius:6px;background:rgba(13,22,28,.92);border:1px solid var(--edge);color:var(--dim);font-size:12px;pointer-events:none;max-width:760px}
#hint.active{border-color:var(--accent);color:var(--accent)}

/* SVG */
.rname{font:700 13px var(--f-display);fill:#d8e6eb}
.rinfo{font:500 8px var(--f-mono);fill:#8aa0aa}
.unum{font:500 4.4px var(--f-mono);fill:#5d6a73;text-anchor:middle}
.lbl{font:600 4.8px var(--f-mono);fill:#1b2228}
.rlbl{font:600 5px var(--f-mono);fill:#71808a}
.model{font:700 7px var(--f-display);fill:#8796a0;letter-spacing:.08em}
.odfl{font:700 6px var(--f-display);fill:#2b3238;letter-spacing:.06em}
.tiny{font:500 3.8px var(--f-mono);fill:#6f7c85}
.tray{font:500 7px var(--f-body);fill:#71808a}
.opl{font:600 7px var(--f-mono);fill:#f2c230}
.pdul{font:700 7px var(--f-display);text-anchor:middle}
.vtxt{font:700 6px var(--f-display);fill:#ff8a8a;text-anchor:middle;letter-spacing:.1em}
.plus{font:500 8px var(--f-mono);fill:#3b464d;text-anchor:middle}
.emptyu{fill:transparent;cursor:pointer}
.emptyu:hover{fill:rgba(255,255,255,.05)}
.slot{fill:rgba(60,224,122,.16);stroke:#3ce07a;stroke-width:.8;cursor:pointer}
.slot:hover{fill:rgba(60,224,122,.38)}
.dev{cursor:pointer}
.dsel{fill:none;stroke:var(--accent);stroke-width:1.4}
.pt .hitp{fill:transparent;cursor:crosshair}
.pt .rj{fill:#0b0e10;stroke:#7c878f;stroke-width:.4}
.pt .rjin{fill:#1c2328}
.pt .cage{fill:#8d989f;stroke:#5d676e;stroke-width:.3}
.pt .lk{fill:transparent}
.pt.up .lk{fill:#3ce07a}
.pt.warn .lk{fill:#ffb547;animation:blink .5s steps(2) infinite}
.pt.err .lk{fill:#ff9f1c}
.pt.down .lk{fill:#6b2b2b}
.pt.shut .rj,.pt.shut .cage{opacity:.55}
.pt.sel .rj,.pt.sel .cage{stroke:var(--accent);stroke-width:1.1}
.pt.cand .rj,.pt.cand .cage{stroke:var(--cyan);stroke-width:1;animation:cand 1s ease-in-out infinite}
.pt:hover .rj,.pt:hover .cage{stroke:#fff}
.cab path{pointer-events:none}
.cab .chit{fill:none;stroke:transparent;stroke-width:7;pointer-events:stroke;cursor:pointer}
.cab:hover path:nth-child(4){stroke-width:2.8}
.psu,.pdu,.bay{cursor:pointer}
.clab{font:500 7px var(--f-mono);fill:#c9dde6}
/* Salle vue de dessus */
.vgroup{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vtitle{font:700 13px var(--f-display);letter-spacing:.06em;color:var(--fg);padding:0 8px;align-self:center}
#viewbar .tbtn{background:rgba(16,30,38,.95)}
.rl{font:500 14px var(--f-body);fill:#8aa0aa}
.rowl{font:700 26px var(--f-display);fill:#9fb4be}
.acold{font:700 13px var(--f-display);fill:#7fd0f2;letter-spacing:.14em}
.ahot{font:700 13px var(--f-display);fill:#e89a6a;letter-spacing:.14em}
.rkl{font:700 10px var(--f-mono);fill:#e2edf1}
.rks{font:500 8px var(--f-mono);fill:#9fb4be}
.plusr{font:600 14px var(--f-mono);fill:#4a5d69}
.rowoff{font:700 12px var(--f-display);fill:#5d6a72;letter-spacing:.12em}
.crl{font:700 11px var(--f-display);fill:#1d262c}
.crs{font:500 9px var(--f-mono);fill:#2f3b42}
.opr{font:600 10px var(--f-mono);fill:#f2c230}
.odfr{font:700 11px var(--f-display);fill:#2b3238}
.infl{font:700 11px var(--f-display);fill:#e2edf1}
.infs{font:500 9.5px var(--f-mono);fill:#bcd0d8}
.rk,.eslot{cursor:pointer}
.rk:hover rect:first-of-type{stroke:#fff}
.eslot:hover rect{stroke:#7fd6ff}
.eslot:hover .plusr{fill:#7fd6ff}
.eslot.off:hover rect{stroke:#ff8a80}
.spin{animation:spin 1.4s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.rtests{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;max-height:46vh;overflow:auto}
.rtests li{display:grid;grid-template-columns:120px 1fr;gap:2px 10px;padding:6px 8px;border-radius:5px;background:#0b1418;border-left:3px solid var(--ok);font-size:12px}
.rtests li.ko{border-left-color:var(--bad)}
.rtests .who{color:var(--dim);grid-row:span 2}
.rtests code{color:#9fd8ee;overflow-wrap:anywhere}
.rtests .res{font-family:var(--f-mono);font-size:11.5px;color:#bfe9cc}
.rtests li.ko .res{color:#ffb2a8}
.blink{animation:blink 1s steps(2) infinite}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.15}}
@keyframes pulse{50%{opacity:.35}}
@keyframes cand{50%{stroke-opacity:.35}}

/* Console */
#console{position:absolute;z-index:3;left:10px;right:10px;bottom:10px;height:min(48%,380px);display:flex;flex-direction:column;background:#05080a;border:1px solid #2b4250;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#console header{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid #1b2b35;font-size:12px;color:var(--dim)}
#console header select{background:#0f171c;color:var(--fg);border:1px solid var(--edge);border-radius:4px;padding:3px 6px;font-family:var(--f-mono);font-size:12px}
#cout{flex:1;margin:0;padding:8px 10px;overflow:auto;font:12px/1.45 var(--f-mono);color:#c9e7d2;white-space:pre-wrap;word-break:break-word}
#cchips{display:flex;gap:5px;flex-wrap:wrap;padding:6px 8px;border-top:1px solid #1b2b35;max-height:72px;overflow:auto}
.chip{background:#0f1d24;border:1px solid #23404d;border-radius:4px;padding:2px 7px;font:11.5px var(--f-mono);color:#9fd8ee}
.chip:hover{border-color:var(--cyan)}
#cform{display:flex;align-items:center;gap:6px;padding:6px 10px;border-top:1px solid #1b2b35;font:12px var(--f-mono)}
#cprompt{color:#7fdca0;white-space:nowrap}
#cin{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:12px var(--f-mono);outline:none}

/* Panneau latéral */
#side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--edge)}
#tabs{display:flex;border-bottom:1px solid var(--edge);background:#0c1418}
#tabs [role=tab]{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 4px;font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.06em;color:var(--dim);position:relative}
#tabs [role=tab][aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:16px;padding:0 4px;margin-left:4px;border-radius:8px;background:var(--bad);color:#1a0705;font:700 10.5px var(--f-mono)}
#sidebody{flex:1;overflow:auto;padding:12px 12px 24px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.intro{margin:0;color:var(--dim);font-size:12.5px}
.card{background:var(--panel-2);border:1px solid var(--edge);border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:7px}
.card header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600;text-wrap:balance}
.card h4{margin:4px 0 0;font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#sidebody>h4{margin:6px 0 -2px;font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.card.internal{border-left:3px solid var(--cyan)}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.muted{color:var(--dim);margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.kv span{color:var(--dim)}
.kv b{font-weight:500;font-family:var(--f-mono);font-size:12px;text-align:right;min-width:0;overflow-wrap:anywhere}
.pill{flex:none;display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.todo{color:var(--cyan)}.pill.offer,.pill.off,.pill.down{color:var(--dim)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#56636b;flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 6px rgba(60,224,122,.6)}.dot.warn,.dot.deg{background:var(--warn)}.dot.bad,.dot.down{background:var(--bad)}.dot.off{background:#3a444b}
.btn{background:linear-gradient(180deg,#1d3240,#142630);border:1px solid #2d4757;border-radius:6px;padding:6px 10px;font-size:12.5px;text-align:center}
.btn:hover{border-color:#4b7286}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:linear-gradient(180deg,#ffc76a,#f29f22);border-color:#ffcf7f;color:#1b1306;font-weight:600}
.btn.danger{color:var(--bad)}
.btn.small{padding:3px 8px;font-size:11.5px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;padding:0;color:var(--cyan);text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.link.mono{font-family:var(--f-mono)}
.unl{margin:0;font-size:12px;color:var(--dim)}
.svcl,.flows,.diag,.plist,.devlist,.events,.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.svcl li{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.svcl .row{font-size:12.5px}
.vmrow{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:#0f1a20;border:1px solid #1e313c;border-radius:5px;padding:4px 8px;font-size:12.5px}
.vmrow:hover{border-color:#3a5869}
.flows li{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:12px}
.diag li{font-size:12px;padding:4px 8px;border-radius:4px;background:#0f1a20;border-left:3px solid var(--warn)}
.diag li.down,.diag li.todo{border-left-color:var(--bad)}
.diag li.todo,.diag li.info{border-left-color:var(--cyan)}
.steps{counter-reset:s}
.steps li{display:flex;gap:8px;align-items:baseline;font-size:12.5px;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:18px;height:18px;border-radius:50%;background:#1b2a33;color:var(--dim);font:600 11px/18px var(--f-mono);text-align:center}
.steps li span{flex:1}
.steps li.done{color:var(--dim)}
.steps li.done::before{background:var(--ok);color:#06210f}
.ck{color:var(--ok);font-style:normal}
.new{color:var(--accent);font-style:normal}
.warnbox{margin:0;padding:7px 9px;border-radius:5px;background:rgba(255,107,93,.1);border:1px solid rgba(255,107,93,.45);font-size:12.5px}
.infobox{margin:0;padding:7px 9px;border-radius:5px;background:rgba(70,199,255,.08);border:1px solid rgba(70,199,255,.45);font-size:12.5px}
.note{margin:0;font-size:12px;color:var(--dim);padding-left:9px;border-left:2px solid var(--edge)}
.hint{margin:0;font-size:12.5px;padding:6px 9px;border-radius:5px;background:#10202a;border:1px solid #23404d}
.alert{margin:0;font-family:var(--f-mono);font-size:12px;padding:6px 9px;border-radius:5px;background:#1c1210;border:1px solid #4a2a24;color:#ffc9bf}
.ticket.fixed .alert{background:#0f1c14;border-color:#244a33;color:#bfe9cc}
.method{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.events li{font-size:12px;color:var(--dim)}
.events li.bad{color:#ffb2a8}.events li.good{color:#a5e8bd}
.events time{font-family:var(--f-mono);font-size:11px;margin-right:5px;color:#5f737c}
.ptable{width:100%;border-collapse:collapse;font-size:12px}
.ptable th{text-align:left;font-weight:500;color:var(--dim);font-size:11px;padding:3px 4px;border-bottom:1px solid var(--edge)}
.ptable td{padding:4px;border-bottom:1px solid #1c2b34;vertical-align:middle}
.ptable tr[data-act]{cursor:pointer}
.ptable tr[data-act]:hover td{background:#18262f}
.ptable .risky td{color:#ffb2a8}
.vl{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--dim);margin:0;border:0;padding:0;min-width:0}
.fld legend{padding:0;margin-bottom:4px}
.fld.chk{flex-direction:row;align-items:center;gap:7px;color:var(--fg)}
.fld select,.fld input[type=text]{background:#0b1418;color:var(--fg);border:1px solid var(--edge);border-radius:5px;padding:6px 8px;font:12.5px var(--f-body);min-width:0;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipc{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--edge);border-radius:5px;background:#0f1a20;font-size:12px;color:var(--fg)}
.ruleform{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.upg{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding-top:7px;border-top:1px solid #1c2b34}
.upg p{font-size:12px;margin:2px 0 0}
.bays{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.baybtn{display:flex;flex-direction:column;align-items:center;padding:3px 0;border-radius:4px;border:1px solid var(--edge);background:#0f1a20;font:600 11px var(--f-mono)}
.baybtn small{font-size:9px;color:var(--dim)}
.baybtn.ok{border-color:#2c6a45}.baybtn.failed{border-color:var(--bad);color:var(--bad)}.baybtn.rebuild{border-color:var(--warn)}
.meter{position:relative;height:8px;border-radius:4px;background:#0b1418;border:1px solid var(--edge);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}.meter i.warn{background:var(--warn)}.meter i.bad{background:var(--bad)}
.meter b{position:absolute;top:0;bottom:0;width:1px;background:#fff8}
pre.cli{margin:0;padding:8px;background:#05080a;border:1px solid #1b2b35;border-radius:5px;font:11.5px/1.4 var(--f-mono);color:#9fd8ee;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto}
.crumb{font-size:12px}
.good{color:var(--ok)}.bad{color:var(--bad)}

/* Modales */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(2,5,7,.72);padding:16px}
.mbox{width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--panel);border:1px solid #2d4757;border-top:2px solid var(--accent);border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.mbox.wide{width:min(960px,100%)}
.mbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--edge)}
.mbox h2{margin:0;font-family:var(--f-display);font-size:18px}
.x{background:none;border:0;font-size:22px;color:var(--dim);line-height:1}
.mbody{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mbody p{margin:0;max-width:72ch}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.item{background:var(--panel-2);border:1px solid var(--edge);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.item.focus{border-color:var(--accent)}
.item.locked{opacity:.5}
.item p{font-size:12.5px}
.ihead{display:flex;justify-content:space-between;gap:8px}
.ihead span{font-family:var(--f-mono);color:#ffd28a}
.lock{color:var(--accent);font-size:12px}
.qtyrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qty{display:flex;align-items:center;gap:6px}
.qty output{min-width:28px;text-align:center;font:600 14px var(--f-mono)}
.qty .btn{width:30px;padding:3px 0;font-size:15px}
.qtot{font-family:var(--f-mono);font-size:12px;color:#ffd28a;text-align:right}
.cablelist{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.cablelist legend{color:var(--dim);font-size:12px;margin-bottom:4px}
.copt{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border:1px solid var(--edge);border-radius:6px;background:#0f1a20;cursor:pointer}
.copt.no{opacity:.62;cursor:default}
.copt span{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.copt small{color:var(--dim);font-size:11.5px}
.copt .sw{flex:none;width:14px;height:6px;border-radius:3px;margin-top:6px}
.iprow{display:flex;gap:6px}
.fiches{display:grid;grid-template-columns:220px 1fr;gap:14px;min-height:0}
.flist{display:flex;flex-direction:column;gap:3px;max-height:64vh;overflow:auto}
.flist button{text-align:left;background:transparent;border:1px solid transparent;border-radius:5px;padding:5px 8px;font-size:12.5px;color:var(--dim)}
.flist button.on{background:var(--panel-2);border-color:var(--edge);color:var(--fg)}
.fbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.fbody h3{margin:0;font-family:var(--f-display);font-size:20px}
.fbody table{border-collapse:collapse;font-size:12.5px;width:100%}
.fbody th,.fbody td{border-bottom:1px solid #1f2f38;padding:4px 6px;text-align:left}
.fbody th{color:var(--dim);font-weight:500}
.fbody p,.fbody ol{margin:0;max-width:72ch}
.retenir{padding:8px 10px;border-radius:6px;background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.4)}
.q{border:1px solid var(--edge);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;margin:0}
.qo{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;padding:2px 0}
.qo.right{color:var(--ok)}.qo.wrong{color:var(--bad)}
.qe{font-size:12.5px}
.q .btn{align-self:flex-start}
.help ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.help h4{margin:0;font-family:var(--f-display)}

/* Toasts */
#toasts{position:fixed;z-index:30;top:62px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{pointer-events:auto;background:var(--panel-2);border:1px solid var(--edge);border-radius:6px;padding:7px 12px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);text-align:center}
button.toast{text-decoration:underline;text-underline-offset:2px}
.toast.bad{border-color:var(--bad)}.toast.good{border-color:var(--ok)}.toast.gold{border-color:var(--accent);color:var(--accent)}.toast.info{border-color:var(--cyan)}

@media (max-width:1100px){#main{grid-template-columns:minmax(0,1fr) 360px}.hide-md{display:none}}
@media (max-width:820px){
  html,body{overflow:auto}
  #app{height:auto;min-height:100%}
  #main{grid-template-columns:1fr;grid-template-rows:62vh auto}
  #side{border-left:0;border-top:1px solid var(--edge)}
  #sidebody{overflow:visible}
  .hide-sm{display:none}
  .fiches{grid-template-columns:1fr}
  .flist{max-height:160px}
  #top{gap:10px}
}
/* Fenêtres de configuration */
#windows{position:fixed;inset:0;z-index:15;pointer-events:none}
.win{position:absolute;width:430px;max-width:calc(100vw - 16px);height:min(72vh,680px);min-width:300px;min-height:180px;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid #2d4757;border-top:2px solid var(--cyan);border-radius:9px;box-shadow:0 18px 50px rgba(0,0,0,.6);pointer-events:auto;resize:both;overflow:hidden}
.win>header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(180deg,#17283a,#111e26);border-bottom:1px solid var(--edge);cursor:move;user-select:none;touch-action:none}
.win .wt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.win .wt b{font-family:var(--f-display);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win .wt .muted{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win .wbody{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.win .x{font-size:20px}
@media (prefers-reduced-motion:reduce){.spin,.blink,.pulse,.pt.cand .rj,.pt.cand .cage,.pt.warn .lk{animation:none}}
</style>

<div id="app">
  <header id="top">
    <div class="brand"><b>HYPERSCALE</b><small>SALLE 01 · DATACENTER</small></div>
    <div class="stat"><span class="lbl">Horloge</span><span class="val" id="clk">–</span></div>
    <div class="stat"><span class="lbl">Trésorerie</span><span class="val" id="money">–</span><span class="sub" id="rate">–</span></div>
    <div class="stat hide-sm"><span class="lbl">Informatique</span><span class="val" id="it">–</span><span class="sub">PUE <span id="pue">–</span></span></div>
    <div class="stat hide-sm"><span class="lbl">Entrée d'air max</span><span class="val" id="tmax">–</span><span class="sub">ASHRAE 18–27 °C</span></div>
    <div class="stat hide-md"><span class="lbl">Grade</span><span class="val" id="rank">–</span><span class="sub" id="xp">–</span></div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Vitesse du temps">
      <button data-speed="0" title="Pause (Espace)">II</button>
      <button data-speed="1" title="1 minute de jeu par seconde">×1</button>
      <button data-speed="5">×5</button>
      <button data-speed="20">×20</button>
    </div>
    <button class="tbtn hl" id="btnShop">Catalogue</button>
    <button class="tbtn" id="btnFiches">Fiches</button>
    <button class="tbtn" id="btnHelp">Aide</button>
  </header>

  <main id="main">
    <section id="view" aria-label="Rangée de baies vue de face">
      <div id="viewbar">
        <div id="vbRoom" class="vgroup">
          <span class="vtitle">Salle 01</span>
          <div class="seg" role="group" aria-label="Couche affichée">
            <button data-layer="etat">État</button>
            <button data-layer="chaleur">Chaleur</button>
            <button data-layer="energie">Énergie</button>
          </div>
        </div>
        <div id="vbRack" class="vgroup" hidden>
          <button class="tbtn" id="backRoom" title="Échap">← Salle</button>
          <div class="seg" role="group" aria-label="Baie">
            <button id="rPrev" aria-label="Baie précédente">◀</button>
            <span id="rName" class="vtitle">A01</span>
            <button id="rNext" aria-label="Baie suivante">▶</button>
          </div>
          <div class="seg" role="group" aria-label="Face">
            <button id="faceFront" title="Touche F">Face avant</button>
            <button id="faceRear" title="Touche F">Face arrière</button>
          </div>
        </div>
        <div class="seg" role="group" aria-label="Zoom">
          <button id="zout" aria-label="Zoom arrière">−</button>
          <button id="zin" aria-label="Zoom avant">+</button>
          <button id="zfit">Ajuster</button>
        </div>
      </div>
      <svg id="rackview" aria-label="Baies vues de face : clique un équipement, un port ou un câble"></svg>
      <p id="hint"></p>
      <div id="console" hidden>
        <header><span>Console</span><select id="ctg" aria-label="Équipement ou VM"></select><span class="spacer"></span><button class="x" id="cclose" aria-label="Fermer la console">×</button></header>
        <pre id="cout"></pre>
        <div id="cchips"></div>
        <form id="cform" autocomplete="off"><span id="cprompt"></span><input id="cin" aria-label="Commande" placeholder="tape une commande, ou « help »" spellcheck="false"></form>
      </div>
    </section>
    <aside id="side">
      <div id="tabs" role="tablist">
        <button role="tab" data-tab="contracts">Contrats</button>
        <button role="tab" data-tab="equip">Équipement</button>
        <button role="tab" data-tab="tickets" id="tabTickets">Tickets<span class="badge" hidden>0</span></button>
        <button role="tab" data-tab="network">Réseau</button>
        <button role="tab" data-tab="room">Salle</button>
      </div>
      <div id="sidebody" role="tabpanel"></div>
    </aside>
  </main>
  <div id="windows"></div>
  <div id="modal" hidden></div>
  <div id="toasts" aria-live="polite"></div>
</div>
<script src="dc/data.js"></script>
<script src="dc/sim.js"></script>
<script src="dc/actions.js"></script>
<script src="dc/learn.js"></script>
<script src="dc/console.js"></script>
<script src="dc/view.js"></script>
<script src="dc/room.js"></script>
<script src="dc/ui.js"></script>

</body>
</html>
