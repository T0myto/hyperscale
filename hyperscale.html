<title>Hyperscale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Thème clair et coloré : une couleur par type d'équipement, gros boutons arrondis */
:root{
  color-scheme:light;
  --bg:#eaf2fb;
  --panel:#ffffff;
  --panel-2:#f4f8fd;
  --panel-3:#e6eef8;
  --edge:#d3deeb;
  --fg:#1c2a3a;
  --dim:#5d6e80;
  --accent:#ff7a1a;
  --accent-2:#ffe3cc;
  --cyan:#2b7de9;
  --ok:#18a058;
  --warn:#e09100;
  --bad:#e5484d;
  --c-router:#ff8a1f;
  --c-switch:#2b7de9;
  --c-server:#18a058;
  --c-fw:#e5484d;
  --c-nas:#8b5cf6;
  --c-odf:#f2b705;
  --shadow:0 2px 0 rgba(28,42,58,.06),0 6px 18px rgba(28,42,58,.08);
  --f-display:'Nunito','Segoe UI',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
code,.mono{font-family:var(--f-mono);font-size:.9em}
code{background:var(--panel-3);padding:1px 5px;border-radius:5px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}

/* En-tête */
#top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:2px solid var(--edge)}
.brand{display:flex;align-items:center;gap:10px;line-height:1.05}
.brand::before{content:'';width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--c-switch) 0 50%,var(--c-router) 50% 100%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.brand>span{display:flex;flex-direction:column}
.brand b{font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.02em;color:var(--fg)}
.brand small{font-size:11px;color:var(--dim);font-weight:700}
.stat{display:flex;flex-direction:column;gap:0;min-width:0;padding:4px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--edge)}
.stat .lbl{font-size:11px;font-weight:800;color:var(--dim)}
.stat .val{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .sub{font-size:11px;color:var(--dim);white-space:nowrap;font-weight:600}
#money{color:#b85e00}#money.neg{color:var(--bad)}
.val.warn{color:var(--warn)}.val.bad{color:var(--bad)}
.spacer{flex:1}
.seg{display:flex;border:2px solid var(--edge);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{background:transparent;border:0;padding:6px 11px;font-size:13px;font-weight:800;color:var(--dim)}
.seg button+button{border-left:2px solid var(--edge)}
.seg button:hover{background:var(--panel-2);color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--cyan);color:#fff}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:7px 13px;font-size:14px;font-weight:800;box-shadow:0 2px 0 var(--edge)}
.tbtn:hover{border-color:var(--cyan);color:var(--cyan)}
.tbtn:active{transform:translateY(1px);box-shadow:none}
.tbtn.hl{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 0 #c55800}
.tbtn.hl:hover{color:#fff;filter:brightness(1.05)}

/* Zone principale */
#main{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
#view{position:relative;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 0%,#f7fbff,#dfeaf6 75%)}
#rackview{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default;user-select:none}
#rackview.panning{cursor:grabbing}
#viewbar{position:absolute;z-index:2;top:12px;left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#viewbar .seg{box-shadow:var(--shadow)}
#hint{position:absolute;z-index:2;left:12px;right:12px;bottom:12px;margin:0;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.95);border:2px solid var(--edge);color:var(--dim);font-size:13px;font-weight:700;pointer-events:none;max-width:760px;box-shadow:var(--shadow)}
#hint.active{border-color:var(--accent);color:#b85e00;background:#fff7ef}

/* SVG : baie */
.rname{font:900 14px var(--f-display);fill:#1c2a3a}
.rinfo{font:700 8.5px var(--f-body);fill:#5d6e80}
.unum{font:600 4.4px var(--f-mono);fill:#8a99aa;text-anchor:middle}
.lbl{font:700 4.8px var(--f-mono);fill:#1c2a3a}
.rlbl{font:800 5.4px var(--f-body);fill:#ffffff}
.model{font:900 7.5px var(--f-display);fill:#ffffff;letter-spacing:.06em}
.odfl{font:900 6px var(--f-display);fill:#5a4500;letter-spacing:.04em}
.tiny{font:700 3.8px var(--f-body);fill:#ffffffcc}
.tray{font:700 7px var(--f-body);fill:#5d6e80}
.opl{font:800 7px var(--f-body);fill:#b38600}
.pdul{font:900 7px var(--f-display);text-anchor:middle}
.vtxt{font:900 6px var(--f-display);fill:#ffffff;text-anchor:middle;letter-spacing:.08em}
.plus{font:700 8px var(--f-body);fill:#9aa9b8;text-anchor:middle}
.kindl{font:900 5px var(--f-body);fill:#ffffff;letter-spacing:.04em}
.emptyu{fill:transparent;cursor:pointer}
.emptyu:hover{fill:rgba(43,125,233,.08)}
.slot{fill:rgba(24,160,88,.16);stroke:#18a058;stroke-width:.9;cursor:pointer}
.slot:hover{fill:rgba(24,160,88,.36)}
.dev{cursor:pointer}
.dev:hover>rect:first-of-type{filter:brightness(1.06)}
.dsel{fill:none;stroke:var(--accent);stroke-width:2}
.pt .hitp{fill:transparent;cursor:crosshair}
.pt .rj{fill:#26313d;stroke:#ffffff;stroke-width:.5}
.pt .rjin{fill:#3b4856}
.pt .cage{fill:#c9d3de;stroke:#ffffff;stroke-width:.4}
.pt .lk{fill:transparent}
.pt.up .lk{fill:#2fe07f}
.pt.warn .lk{fill:#ffb020;animation:blink .5s steps(2) infinite}
.pt.err .lk{fill:#ff8a1f}
.pt.down .lk{fill:#e5484d}
.pt.shut .rj,.pt.shut .cage{opacity:.5}
.pt.sel .rj,.pt.sel .cage{stroke:var(--accent);stroke-width:1.3}
.pt.cand .rj,.pt.cand .cage{stroke:#ffd400;stroke-width:1.2;animation:cand 1s ease-in-out infinite}
.pt:hover .rj,.pt:hover .cage{stroke:#ffd400}
.cab path{pointer-events:none}
.cab .chit{fill:none;stroke:transparent;stroke-width:7;pointer-events:stroke;cursor:pointer}
.cab:hover path:nth-child(4){stroke-width:3}
.psu,.pdu,.bay{cursor:pointer}
.clab{font:700 7px var(--f-body);fill:#3b4b5c}
/* Salle vue de dessus */
.vgroup{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vtitle{font:900 15px var(--f-display);color:var(--fg);padding:0 8px;align-self:center}
#viewbar .tbtn{box-shadow:var(--shadow)}
.rl{font:800 14px var(--f-body);fill:#5d6e80}
.rowl{font:900 28px var(--f-display);fill:#2b7de9}
.acold{font:900 13px var(--f-display);fill:#1f6fd1;letter-spacing:.1em}
.ahot{font:900 13px var(--f-display);fill:#d1541f;letter-spacing:.1em}
.rkl{font:900 11px var(--f-display);fill:#ffffff}
.rks{font:700 8.5px var(--f-body);fill:#ffffffdd}
.plusr{font:800 16px var(--f-body);fill:#8aa0b8}
.rowoff{font:900 12px var(--f-display);fill:#8a99aa;letter-spacing:.08em}
.crl{font:900 11px var(--f-display);fill:#1c2a3a}
.crs{font:700 9px var(--f-body);fill:#3b4b5c}
.opr{font:800 10px var(--f-body);fill:#a37800}
.odfr{font:900 11px var(--f-display);fill:#5a4500}
.infl{font:900 11px var(--f-display);fill:#1c2a3a}
.infs{font:700 9.5px var(--f-body);fill:#3b4b5c}
.rk,.eslot{cursor:pointer}
.rk:hover rect:first-of-type{stroke:var(--accent)}
.eslot:hover rect{stroke:var(--cyan)}
.eslot:hover .plusr{fill:var(--cyan)}
.eslot.off:hover rect{stroke:var(--bad)}
.spin{animation:spin 1.4s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.rtests{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.rtests li{display:grid;grid-template-columns:120px 1fr;gap:2px 10px;padding:8px 10px;border-radius:10px;background:var(--panel-2);border-left:4px solid var(--ok);font-size:13px}
.rtests li.ko{border-left-color:var(--bad);background:#fff1f1}
.rtests .who{color:var(--dim);grid-row:span 2;font-weight:700}
.rtests code{overflow-wrap:anywhere}
.rtests .res{font-family:var(--f-mono);font-size:12px;color:#137a43}
.rtests li.ko .res{color:#b42328}
.blink{animation:blink 1s steps(2) infinite}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.15}}
@keyframes pulse{50%{opacity:.4}}
@keyframes cand{50%{stroke-opacity:.3}}

/* Console (reste sombre : c'est un terminal) */
#console{position:absolute;z-index:3;left:12px;right:12px;bottom:12px;height:min(48%,380px);display:flex;flex-direction:column;background:#14202c;border:2px solid #2b3c4f;border-radius:14px;box-shadow:0 14px 40px rgba(20,32,44,.35);overflow:hidden}
#console header{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#1c2a3a;font-size:13px;font-weight:800;color:#c9d6e3}
#console header select{background:#0f1923;color:#e6eef6;border:1px solid #33475c;border-radius:8px;padding:4px 8px;font-family:var(--f-mono);font-size:12px}
#console .x{color:#c9d6e3}
#cout{flex:1;margin:0;padding:10px 12px;overflow:auto;font:12.5px/1.5 var(--f-mono);color:#d2f5dc;white-space:pre-wrap;word-break:break-word}
#cchips{display:flex;gap:6px;flex-wrap:wrap;padding:7px 10px;border-top:1px solid #2b3c4f;max-height:76px;overflow:auto}
.chip{background:#22344a;border:1px solid #33506e;border-radius:8px;padding:3px 9px;font:12px var(--f-mono);color:#a9d4ff}
.chip:hover{border-color:#7cc0ff;color:#fff}
#cform{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid #2b3c4f;font:12.5px var(--f-mono)}
#cprompt{color:#7fe0a5;white-space:nowrap}
#cin{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:12.5px var(--f-mono);outline:none}

/* Panneau latéral */
#side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:2px solid var(--edge)}
#tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:2px solid var(--edge);background:var(--panel-2)}
#tabs [role=tab]{flex:1;background:transparent;border:0;border-radius:10px 10px 0 0;padding:9px 4px;font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--dim);position:relative}
#tabs [role=tab]:hover{color:var(--fg);background:var(--panel-3)}
#tabs [role=tab][aria-selected="true"]{color:var(--fg);background:var(--panel);box-shadow:inset 0 3px 0 var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font:800 11px var(--f-body)}
#sidebody{flex:1;overflow:auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.intro{margin:0;color:var(--dim);font-size:13px}
.card{background:var(--panel);border:2px solid var(--edge);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.card header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:900;text-wrap:balance}
.card h4{margin:4px 0 0;font-family:var(--f-display);font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
#sidebody>h4{margin:6px 0 -2px;font-family:var(--f-display);font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.card.internal{border-left:5px solid var(--cyan)}
.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.muted{color:var(--dim);margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv span{color:var(--dim)}
.kv b{font-weight:800;font-size:13px;text-align:right;min-width:0;overflow-wrap:anywhere}
.pill{flex:none;display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:800;white-space:nowrap;background:var(--panel-3);color:var(--dim)}
.pill.ok{background:#dcf5e7;color:#137a43}.pill.warn{background:#fff0cc;color:#8a5a00}.pill.bad{background:#ffe1e2;color:#b42328}.pill.todo{background:#dde9fd;color:#1d5fb8}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#b8c4d0;flex:none}
.dot.ok{background:var(--ok)}.dot.warn,.dot.deg{background:var(--warn)}.dot.bad,.dot.down{background:var(--bad)}.dot.off{background:#c9d3de}
.btn{background:var(--panel);border:2px solid var(--edge);border-radius:11px;padding:7px 12px;font-size:13.5px;font-weight:800;text-align:center;box-shadow:0 2px 0 var(--edge)}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 0 #c55800}
.btn.primary:hover{color:#fff;filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.small{padding:4px 9px;font-size:12px;border-radius:9px}
.btnrow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;padding:0;color:var(--cyan);font-weight:800;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.link.mono{font-family:var(--f-mono)}
.unl{margin:0;font-size:12.5px;color:var(--dim)}
.svcl,.flows,.diag,.plist,.devlist,.events,.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.svcl li{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.svcl .row{font-size:13px}
.vmrow{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:var(--panel-2);border:2px solid var(--edge);border-radius:10px;padding:5px 9px;font-size:13px}
.vmrow:hover{border-color:var(--cyan)}
.flows li{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:12px}
.diag li{font-size:13px;padding:6px 10px;border-radius:10px;background:#fff6e0;border-left:4px solid var(--warn)}
.diag li.down,.diag li.todo{border-left-color:var(--bad);background:#fff1f1}
.diag li.todo,.diag li.info{border-left-color:var(--cyan);background:#eef5ff}
.steps{counter-reset:s;gap:7px}
.steps li{display:flex;gap:9px;align-items:baseline;font-size:13.5px;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--panel-3);color:var(--dim);font:900 12px/22px var(--f-body);text-align:center}
.steps li span{flex:1}
.steps li.done{color:var(--dim);text-decoration:line-through;text-decoration-color:#9fb0c2}
.steps li.done::before{content:'✓';background:var(--ok);color:#fff}
.ck{color:var(--ok);font-style:normal;font-weight:900}
.new{color:var(--accent);font-style:normal;font-weight:900}
.warnbox{margin:0;padding:9px 11px;border-radius:12px;background:#fff1f1;border:2px solid #ffc9cb;font-size:13px}
.infobox{margin:0;padding:9px 11px;border-radius:12px;background:#eef5ff;border:2px solid #c6dcfb;font-size:13px}
.note{margin:0;font-size:12.5px;color:var(--dim);padding-left:10px;border-left:3px solid var(--edge)}
.hint{margin:0;font-size:13px;padding:8px 11px;border-radius:12px;background:#fff7ef;border:2px solid #ffd9b8}
.alert{margin:0;font-family:var(--f-mono);font-size:12px;padding:7px 10px;border-radius:10px;background:#fff1f1;border:2px solid #ffc9cb;color:#9c1c21}
.ticket.fixed .alert{background:#e8f8ef;border-color:#b5e6c9;color:#137a43}
.method{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.events li{font-size:12.5px;color:var(--dim)}
.events li.bad{color:#b42328}.events li.good{color:#137a43}
.events time{font-family:var(--f-mono);font-size:11px;margin-right:5px;color:#8a99aa}
.ptable{width:100%;border-collapse:collapse;font-size:12.5px}
.ptable th{text-align:left;font-weight:800;color:var(--dim);font-size:11.5px;padding:4px 5px;border-bottom:2px solid var(--edge)}
.ptable td{padding:5px;border-bottom:1px solid var(--panel-3);vertical-align:middle}
.ptable tr[data-act]{cursor:pointer}
.ptable tr[data-act]:hover td{background:#eef5ff}
.ptable .risky td{color:#b42328}
.vl{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--dim);margin:0;border:0;padding:0;min-width:0}
.fld legend{padding:0;margin-bottom:4px}
.fld.chk{flex-direction:row;align-items:center;gap:7px;color:var(--fg)}
.fld select,.fld input[type=text]{background:var(--panel);color:var(--fg);border:2px solid var(--edge);border-radius:10px;padding:7px 9px;font:600 13px var(--f-body);min-width:0;width:100%}
.fld select:focus,.fld input[type=text]:focus{border-color:var(--cyan);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipc{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:2px solid var(--edge);border-radius:10px;background:var(--panel-2);font-size:12.5px;color:var(--fg)}
.ruleform{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.upg{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding-top:8px;border-top:2px solid var(--panel-3)}
.upg p{font-size:12.5px;margin:2px 0 0}
.bays{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.baybtn{display:flex;flex-direction:column;align-items:center;padding:4px 0;border-radius:9px;border:2px solid var(--edge);background:var(--panel-2);font:800 12px var(--f-body)}
.baybtn small{font-size:9.5px;color:var(--dim)}
.baybtn.ok{border-color:#9fdcb9}.baybtn.failed{border-color:var(--bad);color:var(--bad)}.baybtn.rebuild{border-color:var(--warn)}
.meter{position:relative;height:10px;border-radius:6px;background:var(--panel-3);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:6px}.meter i.warn{background:var(--warn)}.meter i.bad{background:var(--bad)}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:#1c2a3a55}
pre.cli{margin:0;padding:10px;background:#14202c;border-radius:10px;font:12px/1.45 var(--f-mono);color:#a9d4ff;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto}
.crumb{font-size:12.5px}
.good{color:var(--ok)}.bad{color:var(--bad)}

/* Modales */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(28,42,58,.45);padding:16px;backdrop-filter:blur(2px)}
.mbox{width:min(580px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--edge);border-radius:20px;box-shadow:0 24px 60px rgba(28,42,58,.3);overflow:hidden}
.mbox.wide{width:min(980px,100%)}
.mbox header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--panel-2);border-bottom:2px solid var(--edge)}
.mbox h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:900}
.x{background:none;border:0;font-size:24px;color:var(--dim);line-height:1;border-radius:8px;padding:0 6px}
.x:hover{background:var(--panel-3);color:var(--fg)}
.mbody{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mbody p{margin:0;max-width:72ch}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.item{background:var(--panel);border:2px solid var(--edge);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow)}
.item.focus{border-color:var(--accent)}
.item.locked{opacity:.55;filter:grayscale(.6)}
.item p{font-size:13px}
.ihead{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.ihead span{color:#b85e00;font-weight:900}
.lock{color:#b85e00;font-size:12.5px;font-weight:800}
.qtyrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qty{display:flex;align-items:center;gap:6px}
.qty output{min-width:28px;text-align:center;font:900 15px var(--f-body)}
.qty .btn{width:32px;padding:3px 0;font-size:16px}
.qtot{font-size:13px;font-weight:800;color:#b85e00;text-align:right}
.cablelist{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.cablelist legend{color:var(--dim);font-size:12.5px;font-weight:700;margin-bottom:4px}
.copt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:2px solid var(--edge);border-radius:12px;background:var(--panel-2);cursor:pointer}
.copt:hover{border-color:var(--cyan)}
.copt.no{opacity:.6;cursor:default}
.copt span{display:flex;flex-direction:column;gap:2px;font-size:13px}
.copt small{color:var(--dim);font-size:12px}
.copt .sw{flex:none;width:18px;height:8px;border-radius:4px;margin-top:6px}
.iprow{display:flex;gap:6px}
.fiches{display:grid;grid-template-columns:230px 1fr;gap:16px;min-height:0}
.flist{display:flex;flex-direction:column;gap:4px;max-height:64vh;overflow:auto}
.flist button{text-align:left;background:transparent;border:2px solid transparent;border-radius:10px;padding:6px 9px;font-size:13px;font-weight:700;color:var(--dim)}
.flist button:hover{background:var(--panel-2);color:var(--fg)}
.flist button.on{background:#eef5ff;border-color:#c6dcfb;color:var(--fg)}
.fbody{display:flex;flex-direction:column;gap:10px;min-width:0}
.fbody h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:900}
.fbody table{border-collapse:collapse;font-size:13px;width:100%}
.fbody th,.fbody td{border-bottom:1px solid var(--panel-3);padding:5px 7px;text-align:left}
.fbody th{color:var(--dim);font-weight:800;background:var(--panel-2)}
.fbody p,.fbody ol{margin:0;max-width:72ch}
.retenir{padding:10px 12px;border-radius:12px;background:#fff7e0;border:2px solid #ffe08a}
.q{border:2px solid var(--edge);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;margin:0}
.qo{display:flex;gap:7px;align-items:flex-start;font-size:13px;padding:2px 0}
.qo.right{color:var(--ok);font-weight:800}.qo.wrong{color:var(--bad);font-weight:800}
.qe{font-size:13px}
.q .btn{align-self:flex-start}
.help ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.help h4{margin:0;font-family:var(--f-display);font-weight:900}

/* Toasts */
#toasts{position:fixed;z-index:30;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;width:min(540px,calc(100% - 32px))}
.toast{pointer-events:auto;background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:9px 14px;font-size:13.5px;font-weight:700;box-shadow:0 10px 26px rgba(28,42,58,.18);text-align:center}
button.toast{text-decoration:underline;text-underline-offset:2px}
.toast.bad{border-color:var(--bad);background:#fff1f1}.toast.good{border-color:var(--ok);background:#e8f8ef}.toast.gold{border-color:var(--accent);background:#fff7ef;color:#b85e00}.toast.info{border-color:var(--cyan);background:#eef5ff}

@media (max-width:1100px){#main{grid-template-columns:minmax(0,1fr) 370px}.hide-md{display:none}}
@media (max-width:820px){
  html,body{overflow:auto}
  #app{height:auto;min-height:100%}
  #main{grid-template-columns:1fr;grid-template-rows:62vh auto}
  #side{border-left:0;border-top:2px solid var(--edge)}
  #sidebody{overflow:visible}
  .hide-sm{display:none}
  .fiches{grid-template-columns:1fr}
  .flist{max-height:160px}
  #top{gap:8px}
}
/* Fenêtres de configuration */
#windows{position:fixed;inset:0;z-index:15;pointer-events:none}
.win{position:absolute;width:500px;max-width:calc(100vw - 16px);height:min(72vh,680px);min-width:300px;min-height:180px;display:flex;flex-direction:column;
  background:var(--panel);border:2px solid var(--edge);border-radius:16px;box-shadow:0 18px 50px rgba(28,42,58,.25);pointer-events:auto;resize:both;overflow:hidden}
.win>header{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel-2);border-bottom:2px solid var(--edge);box-shadow:inset 0 4px 0 var(--wc,var(--cyan));cursor:move;user-select:none;touch-action:none}
.win .wt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.win .wt b{font-family:var(--f-display);font-size:16px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win .wt .muted{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win .wbody{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.win .x{font-size:22px}
.wtabs{display:flex;gap:4px;padding:8px 10px 0;background:var(--panel-2);border-bottom:2px solid var(--edge)}
.wtabs button{flex:1;background:transparent;border:0;border-radius:10px 10px 0 0;padding:8px 4px;font-weight:800;font-size:13px;color:var(--dim);white-space:nowrap}
.wtabs button:hover{background:var(--panel-3);color:var(--fg)}
.wtabs button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:inset 0 3px 0 var(--wc,var(--cyan))}
.ptable tr.on td{background:#eef5ff}
.ptable tr.on td:first-child{box-shadow:inset 3px 0 0 var(--wc,var(--cyan))}
.chipc.on{border-color:var(--wc,var(--cyan));background:#eef5ff}
button.chipc{cursor:pointer;font-weight:700}
.wterm{display:flex;flex-direction:column;min-height:300px;flex:1;background:#14202c;border-radius:12px;overflow:hidden}
.wout{flex:1;margin:0;padding:10px 12px;min-height:200px;max-height:46vh;overflow:auto;font:12px/1.5 var(--f-mono);color:#d2f5dc;white-space:pre-wrap;word-break:break-word}
.wchips{display:flex;gap:5px;flex-wrap:wrap;padding:7px 10px;border-top:1px solid #2b3c4f;max-height:92px;overflow:auto}
.wcli{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid #2b3c4f;font:12.5px var(--f-mono)}
.wprompt{color:#7fe0a5;white-space:nowrap}
.wcli input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:12.5px var(--f-mono);outline:none}
.card.fbody{gap:10px}
.tscroll{max-height:240px;overflow:auto;border-radius:10px}
.tscroll thead th{position:sticky;top:0;background:var(--panel)}
.card.fbody h3{font-size:19px}
.guide .steps li::before{background:var(--wc,var(--cyan));color:#fff}
@media (prefers-reduced-motion:reduce){.spin,.blink,.pulse,.pt.cand .rj,.pt.cand .cage,.pt.warn .lk{animation:none}}
/* ----- Contrats : chapitres, guide pas à pas, notions ----- */
#tabs [role=tab][hidden]{display:none}
.chap{padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,#fff4e8,#eef5ff);border:2px solid var(--edge)}
.chap h3{margin:2px 0 4px;font-family:var(--f-display);font-weight:900;font-size:19px}
.chap p{margin:0;font-size:13px}
.chapdots{display:flex;gap:6px;margin-top:9px}
.chapdots i{width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--edge)}
.chapdots i.ok{background:var(--ok);border-color:var(--ok)}
.chapdots i.cur{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px #ffd9b8}
.ccard p{margin:0}
.ccard.cur{border-color:#ffc999;box-shadow:0 0 0 3px #fff0e2,var(--shadow)}
.ccard.offer{border-style:dashed;border-color:var(--accent)}
.lbl{margin:6px 0 0;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}

ol.guide2{list-style:none;margin:0;padding:0;counter-reset:g;display:flex;flex-direction:column;gap:5px}

label.chk{display:flex;gap:8px;align-items:center;font-size:13.5px}

<div id="app">
  <header id="top">
    <div class="brand"><span><b>Hyperscale</b><small>Ton datacenter · BTS SIO SISR</small></span></div>
    <div class="stat"><span class="lbl">🕒 Heure</span><span class="val" id="clk">–</span></div>
    <div class="stat"><span class="lbl">💰 Argent</span><span class="val" id="money">–</span><span class="sub" id="rate">–</span></div>
    <div class="stat hide-sm"><span class="lbl">⚡ Conso</span><span class="val" id="it">–</span><span class="sub">PUE <span id="pue">–</span></span></div>
    <div class="stat hide-sm"><span class="lbl">🌡️ Température</span><span class="val" id="tmax">–</span><span class="sub">idéal 18 à 27 °C</span></div>
    <div class="stat hide-md"><span class="lbl">⭐ Grade</span><span class="val" id="rank">–</span><span class="sub" id="xp">–</span></div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Vitesse du temps">
      <button data-speed="0" title="Pause (Espace)">II</button>
      <button data-speed="1" title="1 minute de jeu par seconde">×1</button>
      <button data-speed="5">×5</button>
      <button data-speed="20">×20</button>
    </div>
    <button class="tbtn hl" id="btnShop"><span aria-hidden="true">🛒</span> Catalogue</button>

    <button class="tbtn" id="btnHelp"><span aria-hidden="true">❓</span> Aide</button>
  </header>

  <main id="main">
    <section id="view" aria-label="Rangée de baies vue de face">

          <span class="vtitle">Salle 01</span>

        </div>

          <button id="zin" aria-label="Zoom avant">+</button>

    <aside id="side">
